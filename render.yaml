services:
  - type: web
    name: stripe-terminal-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: REGISTER_READERS_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
